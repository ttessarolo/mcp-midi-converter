name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify and package (macOS arm64)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify, test, and package
        run: make release

      - name: Upload clean macOS arm64 package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mpc-midi-converter-macos-arm64-${{ github.sha }}
          path: |
            dist/MPC-MIDI-Converter-macOS-arm64.zip
            dist/MPC-MIDI-Converter-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
